[workspace]
members = [
    "crates/pathweaver-core",
    "crates/pathweaver-proto",
    "crates/pathweaver-controller",
    "crates/pathweaver-agent",
    "crates/pathweaver-netd",
    "crates/pathweaver-updater",
    "crates/pathweaver-topology",
    "crates/pathweaver-routing",
    "crates/pathweaver-storage",
    "crates/pathweaver-security",
    "crates/pathweaver-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tonic = "0.12"
prost = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = "0.23"
rustls-pemfile = "2"
argon2 = "0.5"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
ring = "0.17"
reqwest = { version = "0.12", features = ["json"] }
