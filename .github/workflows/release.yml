name: Build & Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Build backend
        run: cargo build --release -p pathweaver-controller

      - name: Package
        run: |
          mkdir -p release-artifacts/web
          cp target/release/pathweaver-controller release-artifacts/pathweaver-controller-x86_64
          cp -r web/dist/* release-artifacts/web/
          cp install.sh release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathweaver-release
          path: release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: |
            Automated build from commit `${{ github.sha }}`

            ### Files
            - `pathweaver-controller` – Linux x86_64 binary
            - `install.sh` – One-click installer (downloads this binary)
          files: |
            release-artifacts/pathweaver-controller-x86_64
            release-artifacts/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
