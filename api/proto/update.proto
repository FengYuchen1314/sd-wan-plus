syntax = "proto3";

package pathweaver.update;

message UpdateJobRequest {
    string target_version = 1;
    string manifest_sha256 = 2;
}

message UpdateJobResponse {
    string update_job_id = 1;
    string status = 2;
}

message UpdateTargetStatus {
    string node_id = 1;
    string status = 2;
    string error_message = 3;
}

message UpdateStatusRequest {
    string update_job_id = 1;
    string node_id = 2;
    string status = 3;
    string error_message = 4;
}

message UpdateStatusResponse {
    bool accepted = 1;
}

message UpdateStageRequest {
    string update_job_id = 1;
    string artifact_id = 2;
    uint64 offset = 3;
    bytes data = 4;
    bool is_last = 5;
}

message UpdateStageResponse {
    bool success = 1;
    string sha256 = 2;
}

message UpdateHealthCheckRequest {
    string update_job_id = 1;
    string node_id = 2;
}

message UpdateHealthCheckResponse {
    bool healthy = 1;
    string error_message = 2;
}

message UpdateRollbackRequest {
    string update_job_id = 1;
    string node_id = 2;
}

message UpdateRollbackResponse {
    bool success = 1;
}

service UpdateService {
    rpc ReportUpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
    rpc StageArtifact(stream UpdateStageRequest) returns (UpdateStageResponse);
    rpc HealthCheck(UpdateHealthCheckRequest) returns (UpdateHealthCheckResponse);
    rpc Rollback(UpdateRollbackRequest) returns (UpdateRollbackResponse);
}
